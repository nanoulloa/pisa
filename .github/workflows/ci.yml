name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: Engine and contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: npm ci
      - run: uv sync --all-packages --all-groups --locked
      - name: Generated contracts are up to date
        run: make gen-check
      - name: Ruff
        run: uv run ruff check . && uv run ruff format --check .
      - name: mypy (strict)
        run: uv run mypy services/engine scripts packages/contracts/python/src
      - name: pytest
        run: uv run pytest

  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: ESLint
        run: npm run lint --workspaces --if-present
      - name: TypeScript (strict)
        run: npm run typecheck --workspaces --if-present
      - name: Vitest
        run: npm run test --workspaces --if-present
      - name: Build
        run: npm run build --workspace @pisa/web
      - name: Install Playwright Chromium
        run: npx --workspace @pisa/web playwright install --with-deps chromium
      - name: Playwright smoke test
        run: npm run e2e --workspace @pisa/web

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
