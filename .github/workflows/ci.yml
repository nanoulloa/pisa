name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: Engine and contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
      - name: Install ffmpeg
        timeout-minutes: 12
        uses: ./.github/actions/ffmpeg
      - run: npm ci
      - run: uv sync --all-packages --all-groups --locked
      - name: Generated contracts are up to date
        run: make gen-check
      - name: Ruff
        run: uv run ruff check . && uv run ruff format --check .
      - name: mypy (strict)
        run: uv run mypy services/engine scripts brand packages/contracts/python/src
      - name: pytest
        run: uv run pytest

  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: ESLint
        run: npm run lint --workspaces --if-present
      - name: TypeScript (strict)
        run: npm run typecheck --workspaces --if-present
      - name: Vitest
        run: npm run test --workspaces --if-present
      - name: Build
        run: npm run build --workspace @pisa/web
        env:
          NEXT_PUBLIC_ENGINE_URL: http://localhost:8100
      # The browser tests run the real engine (free color segmenter, never a paid API).
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
      - name: Install ffmpeg
        timeout-minutes: 12
        uses: ./.github/actions/ffmpeg
      - run: uv sync --all-packages --locked
      - name: Install Playwright Chromium
        run: npx --workspace @pisa/web playwright install --with-deps chromium
      - name: Playwright end-to-end tests
        run: npm run e2e --workspace @pisa/web

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The CLI over the full history: the gitleaks action fails on a branch's first push.
      - name: gitleaks
        run: >-
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1
          git /repo --redact --verbose --exit-code 1
