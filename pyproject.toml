# uv workspace root: one lockfile for every Python package in the repo.
[tool.uv.workspace]
members = ["services/engine", "packages/contracts/python"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["packages/contracts/python/src/pisa_contracts/models.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "S", "PT"]
ignore = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["pisa_contracts", "pisa_engine"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[dependency-groups]
dev = [
    "datamodel-code-generator>=0.86.0",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.pytest.ini_options]
testpaths = ["services/engine/tests"]
addopts = ["--strict-markers", "-ra"]
